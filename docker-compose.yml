# ============================================================
# CommerceSphere — Docker Compose
# Brings up infrastructure services + API Gateway.
# Usage: docker-compose up -d
# ============================================================
# Reads from .env in the same directory (copy .env.example → .env first).

services:
  # ---- PostgreSQL --------------------------------------------
  # Used by: Auth, User, Order, Payment, Inventory, Analytics
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commercesphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      POSTGRES_DB: ${POSTGRES_DB:-commercesphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commercesphere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MongoDB -----------------------------------------------
  # Used by: Catalog Service (document store for products/categories)
  mongo:
    image: mongo:7
    container_name: cs-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-commercesphere}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis -------------------------------------------------
  # Used by: Cache (Catalog), Sessions, Cart storage
  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- RabbitMQ ----------------------------------------------
  # Event bus for async communication (ORDER_CREATED, INVENTORY_RESERVED, etc.)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cs-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-commercesphere}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Auth Service -------------------------------------------
  # Handles signup, login, JWT issue/refresh, RBAC (Admin/Customer).
  # Database: PostgreSQL (database-per-service — uses commercesphere_auth DB).
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: cs-auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-commercesphere_auth}
      DB_USER: ${POSTGRES_USER:-commercesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Catalog Service ----------------------------------------
  # Handles products, categories, search, image upload, and caching.
  # Database: MongoDB (document store for flexible product attributes).
  # Cache: Redis (cache-aside for product lists, details, categories).
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: cs-catalog-service
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-commercesphere}:${MONGO_INITDB_ROOT_PASSWORD:-changeme_mongo}@mongo:27017/commercesphere_catalog?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}
      UPLOAD_DIR: uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - catalog_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Cart Service ----------------------------------------
  # Handles shopping cart CRUD, guest/user carts, merge on login.
  # Database: Redis (primary store — NOT a cache). No backing DB.
  # Cross-service: validates products via REST call to catalog-service.
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cs-cart-service
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}
      CATALOG_SERVICE_URL: http://catalog-service:3002
      GUEST_CART_TTL: 604800
      USER_CART_TTL: 2592000
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- API Gateway -------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cs-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  # ---- Order Service -------------------------------------------
  # Handles order creation from cart, lifecycle management, RabbitMQ events.
  # Database: PostgreSQL (database-per-service — uses commercesphere_orders DB).
  # Messaging: RabbitMQ (publishes order.created, consumes inventory responses).
  # Cross-service: REST calls to cart-service and catalog-service.
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: cs-order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${ORDER_DB_NAME:-commercesphere_orders}
      DB_USER: ${POSTGRES_USER:-commercesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-commercesphere}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}@rabbitmq:5672
      CART_SERVICE_URL: http://cart-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Inventory Service ----------------------------------------
  # Handles stock management and reservation via RabbitMQ event consumers.
  # Database: PostgreSQL (database-per-service — uses commercesphere_inventory DB).
  # Messaging: RabbitMQ (consumes order.created/cancelled, publishes inventory.reserved/failed).
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: cs-inventory-service
    restart: unless-stopped
    environment:
      PORT: 3005
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${INVENTORY_DB_NAME:-commercesphere_inventory}
      DB_USER: ${POSTGRES_USER:-commercesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-commercesphere}:${RABBITMQ_DEFAULT_PASS:-changeme_rabbit}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data:
  mongo_data:
  redis_data:
  rabbit_data:
  catalog_uploads:

